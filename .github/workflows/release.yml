name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup npm
        run: npm install --global npm@11.16.0 --ignore-scripts

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate release tag
        if: github.event_name == 'push'
        run: npm run release:check-tag

      - name: Validate release metadata (dry run)
        if: github.event_name == 'workflow_dispatch'
        run: npm run release:check-tag -- --dry-run

      - name: Run full verification
        run: npm run verify

  publish:
    name: Publish package and GitHub Release
    if: github.event_name == 'push'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Setup npm
        run: npm install --global npm@11.16.0 --ignore-scripts

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build and inspect package
        run: |
          npm run build
          npm run pack:check

      - name: Publish with provenance
        run: npm publish --provenance --access public

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "design-token-pipeline $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
