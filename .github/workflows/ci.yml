name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup npm
        run: npm install --global npm@11.16.0 --ignore-scripts

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run verification
        shell: bash
        run: |
          mkdir -p .ci
          set -o pipefail
          npm run verify 2>&1 | tee .ci/verify.log

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-diagnostics-${{ github.run_id }}
          path: .ci/verify.log
          if-no-files-found: ignore
          retention-days: 7

  security:
    name: Security gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup npm
        run: npm install --global npm@11.16.0 --ignore-scripts

      - name: Install without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run dependency security checks
        shell: bash
        run: |
          mkdir -p .ci
          set -o pipefail
          npm run security:check 2>&1 | tee .ci/security.log

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-diagnostics-${{ github.run_id }}
          path: .ci/security.log
          if-no-files-found: ignore
          retention-days: 7
